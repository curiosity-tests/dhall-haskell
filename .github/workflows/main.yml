env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
  cache_generation: 2024-06-13

# NOTE: Please keep .mergify.yml in sync when adding or removing any jobs.
name: main
run-name: "main ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  pull_request:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
permissions:
  contents: read
  id-token: write
jobs:
  build:
    strategy:
      matrix:
        os:
        - runner: 'ubuntu-latest'
          archive-command: 'tar --create --bzip2 --file'
          file-extension: 'tar.bz2'
          executable-extension: ''
        stack-yaml:
        - "stack.yaml"
        include:
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-8.10.yaml"
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-9.2.yaml"
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-9.4.yaml"
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-9.8.yaml"
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-9.10.yaml"
        - os:
            runner: "ubuntu-latest"
          stack-yaml: "stack.ghc-9.12.yaml"
      fail-fast: false
    name: ${{ matrix.os.runner }} - ${{ matrix.stack-yaml }}
    runs-on: ${{ matrix.os.runner }}
    steps:
    - name: "Checkout repository"
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        submodules: true
    - id: setup-haskell-cabal
      name: "Setup Haskell environment"
      uses: haskell-actions/setup@v2.12
      with:
        enable-stack: true
        stack-version: "latest"
        stack-no-global: true
    - name: "Cache"
      uses: actions/cache@v6
      with:
        key: ${{ matrix.os.runner }}-${{ runner.arch }}-${{ env.cache_generation }}-${{ hashFiles(matrix.stack-yaml) }}
        restore-keys: |
          ${{ matrix.os.runner }}-${{ runner.arch }}-${{ env.cache_generation }}-
        path: |
          ${{ steps.setup-haskell-cabal.outputs.stack-root }}
    - name: "Install libsodium"
      shell: bash
      run: |
        if [ '${{matrix.os.runner}}' == 'ubuntu-latest' ]; then
          sudo apt-get install -y libsodium-dev
        fi
        echo "::debug::'pkg-config libsodium' output:"
        pkg-config --print-errors --libs libsodium || true
    - name: "Build"
      shell: bash
      run: |
        packages=(
          dhall
          dhall-bash
          dhall-csv
          dhall-docs
          dhall-json
          dhall-lsp-server
          dhall-nix
          dhall-openapi
          dhall-toml
          dhall-yaml
        )
        for package in "${packages[@]}"; do
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.8.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.10.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.12.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.os.runner}}' == 'windows-latest' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi

          # We use --test --no-run-tests to avoid re-building all the local packages in the
          # subsequent test step.
          # See https://github.com/commercialhaskell/stack/issues/4977.
          stack --stack-yaml "${{matrix.stack-yaml}}" build --test --no-run-tests --copy-bins --local-bin-path ./bin "${package}"
        done
    - name: "Run tests"
      shell: bash
      run: |
        packages=(
          dhall
          dhall-bash
          dhall-csv
          dhall-docs
          dhall-json
          dhall-lsp-server
          dhall-nix
          dhall-openapi
          dhall-toml
          dhall-yaml
        )
        for package in "${packages[@]}"; do
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.8.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.10.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.stack-yaml}}' == 'stack.ghc-9.12.yaml' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi
          if [ '${{matrix.os.runner}}' == 'windows-latest' ] && [ "${package}" == 'dhall-nix' ]; then
            continue
          fi

          stack --stack-yaml "${{matrix.stack-yaml}}" test "${package}"
        done
    - name: "Prepare packaging"
      if: ${{ matrix.stack-yaml == 'stack.yaml' }}
      shell: bash
      run: |
        mkdir -p share/man/man1
        cp dhall/man/dhall.1 share/man/man1/
        cp dhall-docs/src/Dhall/data/man/dhall-docs.1 share/man/man1/
    - id: package
      name: "Create packages"
      if: ${{ matrix.stack-yaml == 'stack.yaml' }}
      shell: bash
      run: |
        packages=(
          dhall
          dhall-bash
          dhall-csv
          dhall-docs
          dhall-json
          dhall-lsp-server
          dhall-nix
          dhall-openapi
          dhall-toml
          dhall-yaml
        )

        function package() (
          local package="${1}"
          local version="$(stack query locals "${package}" version)"
          shift
          local assets=("${@}")
          local package_file="${package}-${version}-${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}"
          ${{matrix.os.archive-command}} "${package_file}" "${assets[@]}"
        )

        exe='${{matrix.os.executable-extension}}'
        package 'dhall' "bin/dhall${exe}" 'share/man/man1/dhall.1'
        package 'dhall-bash' "bin/dhall-to-bash${exe}"
        package 'dhall-csv' "bin/csv-to-dhall${exe}" "bin/dhall-to-csv${exe}"
        package 'dhall-docs' "bin/dhall-docs${exe}" 'share/man/man1/dhall-docs.1'
        package 'dhall-json' "bin/dhall-to-json${exe}" "bin/dhall-to-yaml${exe}" "bin/json-to-dhall${exe}"
        package 'dhall-lsp-server' "bin/dhall-lsp-server${exe}"
        if [ '${{matrix.os.runner}}' != 'windows-latest' ]; then
            package 'dhall-nix' "bin/dhall-to-nix${exe}"
        fi
        package 'dhall-openapi' "bin/openapi-to-dhall${exe}"
        package 'dhall-toml' "bin/dhall-to-toml${exe}" "bin/toml-to-dhall${exe}"
        package 'dhall-yaml' "bin/dhall-to-yaml-ng${exe}" "bin/yaml-to-dhall${exe}"
    - name: "Upload package"
      if: ${{ matrix.stack-yaml == 'stack.yaml' }}
      uses: actions/upload-artifact@v7
      with:
        name: 'dhall-${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}'
        path: 'dhall-*${{ runner.os }}-${{ runner.arch }}.${{ matrix.os.file-extension }}'
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
